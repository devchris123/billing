name: schwarz_trial

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 2s
      timeout: 5s
      retries: 15
    logging: *default-logging

  kafka:
    image: confluentinc/confluent-local:7.5.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: 1800000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
      KAFKA_LOG_SEGMENT_MS: 300000
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        migrate \
          -path=/migrations \
          -database=postgres://billing:billing@postgres:5432/billing?sslmode=disable \
          up
        command_status=$$?
        sleep 6
        exit $$command_status
    depends_on:
      postgres:
        condition: service_healthy
      alloy:
        condition: service_started
    restart: "no"
    logging: *default-logging

  kafka-init:
    image: confluentinc/confluent-local:7.5.0
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        kafka-topics \
          --bootstrap-server=kafka:29092 \
          --create \
          --if-not-exists \
          --topic=billing.vm.events \
          --partitions=1 \
          --replication-factor=1 \
          --config=retention.ms=1800000
        command_status=$$?
        sleep 6
        exit $$command_status
    depends_on:
      kafka:
        condition: service_healthy
      alloy:
        condition: service_started
    restart: "no"
    logging: *default-logging

  app:
    build:
      context: .
    environment:
      DB_URL: postgres://billing:billing@postgres:5432/billing?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP: billing.sessionizer
      KAFKA_TOPIC: billing.vm.events
      MAX_OUT_OF_ORDERNESS: 10m
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  producer:
    build:
      context: .
      dockerfile: cmd/event-producer/Dockerfile
    command:
      - -brokers=kafka:29092
      - -topic=billing.vm.events
      - -count=0
      - -instances=5
      - -start-probability=0.5
      - -interval=5s
      - -event-time-step=1m
      - -max-duration=30m
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure
    logging: *default-logging

  grafana-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: billing
    volumes:
      - ./dev/observability/create-grafana-reader.sql:/scripts/create-grafana-reader.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql \
          -h postgres \
          -U billing \
          -d billing \
          -v ON_ERROR_STOP=1 \
          -f /scripts/create-grafana-reader.sql
        command_status=$$?
        sleep 6
        exit $$command_status
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.2
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./dev/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.19.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./dev/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./dev/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./dev/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dev/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      loki:
        condition: service_started
      grafana-db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  loki-data:
  alloy-data:
  grafana-data:
